<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplitCart - Grocery Expense Sharing</title>
  
  <!-- Load React -->
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- Load Babel -->
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  
  <!-- Load Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Load Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Initialize Supabase
    const SUPABASE_URL = "https://totjcxfdmldxhzhsekhw.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvdGpjeGZkbWxkeGh6aHNla2h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MzY1MjAsImV4cCI6MjA4NTIxMjUyMH0.lEruY2MgcKYFizt_dyDGbeD4TXELZZ8qwLSN30jaw1w";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const DEFAULT_ROOMMATES = {
      person1: { name: 'Alex', color: '#e07a5f' },
      person2: { name: 'Jordan', color: '#81b29a' },
      person3: { name: 'Taylor', color: '#f4a261' }
    };

    const STORES = ['Walmart', 'Indian Market', 'Kroger', 'Target', 'Costco', 'Trader Joe\'s', 'Whole Foods', 'Aldi', 'Other'];

    // Supabase helper functions
    const supabaseHelpers = {
      async getExpenses(householdId) {
        try {
          const { data, error } = await supabase
            .from('expenses')
            .select('*')
            .eq('household_id', householdId)
            .order('created_at', { ascending: false });

          if (error) throw error;
          return data || [];
        } catch (error) {
          console.error('Error fetching expenses:', error);
          return [];
        }
      },

      async addExpense(householdId, item, amount, paid_by) {
        try {
          const { data, error } = await supabase
            .from('expenses')
            .insert({
              household_id: householdId,
              item: item,
              amount: amount,
              paid_by: paid_by
            })
            .select();

          if (error) throw error;
          return true;
        } catch (error) {
          console.error('Error adding expense:', error);
          alert('Error adding expense: ' + error.message);
          return false;
        }
      },

      async deleteExpense(expenseId) {
        try {
          const { error } = await supabase
            .from('expenses')
            .delete()
            .eq('id', expenseId);

          if (error) throw error;
          return true;
        } catch (error) {
          console.error('Error deleting expense:', error);
          alert('Error deleting expense: ' + error.message);
          return false;
        }
      },

      async getOrCreateHousehold(householdName) {
        try {
          // Check if household exists
          const { data: existingData, error: checkError } = await supabase
            .from('households')
            .select('id')
            .eq('name', householdName)
            .single();

          if (existingData) {
            return existingData.id;
          }

          // Create new household
          const { data: newData, error: createError } = await supabase
            .from('households')
            .insert({ name: householdName })
            .select()
            .single();

          if (createError) throw createError;
          return newData.id;
        } catch (error) {
          console.error('Error with household:', error);
          return null;
        }
      }
    };

    // Icons (simplified inline SVG components)
    const ShoppingCart = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>;
    const Plus = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const Trash2 = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
    const Home = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    const Receipt = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><path d="M16 8h-6M16 12h-6M16 16h-6"/></svg>;
    const User = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const Settings = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m-9-6h6m6 0h6"/></svg>;
    const Calendar = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    const Store = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    const DollarSign = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
    const TrendingUp = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
    const RefreshCw = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36M20.49 15a9 9 0 0 1-14.85 3.36"/></svg>;

    function GroceryExpenseApp() {
      const [currentView, setCurrentView] = useState('home');
      const [expenses, setExpenses] = useState([]);
      const [householdId, setHouseholdId] = useState(null);
      const [householdName, setHouseholdName] = useState('');
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [selectedPerson, setSelectedPerson] = useState('');
      const [people, setPeople] = useState([]);

      useEffect(() => {
        initializeHousehold();
      }, []);

      const initializeHousehold() => {
        // Get or create default household
        supabaseHelpers.getOrCreateHousehold('Default Household').then(id => {
          if (id) {
            setHouseholdId(id);
            setHouseholdName('Default Household');
            loadExpenses(id);
          }
        });
      };

      const loadExpenses = async (hId) => {
        setRefreshing(true);
        const data = await supabaseHelpers.getExpenses(hId);
        setExpenses(data);
        
        // Extract unique people from paid_by field
        const uniquePeople = [...new Set(data.map(e => e.paid_by))].filter(Boolean);
        setPeople(uniquePeople);
        if (uniquePeople.length > 0 && !selectedPerson) {
          setSelectedPerson(uniquePeople[0]);
        }
        
        setLoading(false);
        setRefreshing(false);
      };

      const addExpense = async (item, amount, paid_by) => {
        setLoading(true);
        if (await supabaseHelpers.addExpense(householdId, item, parseFloat(amount), paid_by)) {
          await loadExpenses(householdId);
          setCurrentView('home');
        } else {
          setLoading(false);
        }
      };

      const deleteExpense = async (expenseId) => {
        if (await supabaseHelpers.deleteExpense(expenseId)) {
          await loadExpenses(householdId);
        }
      };

      if (loading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50 flex items-center justify-center">
            <div className="text-center">
              <ShoppingCart className="w-16 h-16 text-orange-600 animate-bounce mx-auto mb-4" />
              <p className="text-xl text-gray-700">Loading...</p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50">
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Karla:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap');
            * { font-family: 'Karla', sans-serif; }
            .display-font { font-family: 'Playfair Display', serif; }
            .mono-font { font-family: 'JetBrains Mono', monospace; }
            .card-shadow { box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.1); }
            .spin { animation: spin 1s linear infinite; }
            @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
          `}</style>

          <header className="bg-white border-b-4 border-orange-900 sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 py-4">
              <div className="flex items-center justify-between flex-wrap gap-4">
                <div className="flex items-center gap-3">
                  <ShoppingCart className="w-8 h-8 text-orange-600" />
                  <div>
                    <h1 className="text-3xl font-black text-orange-900 display-font">SplitCart</h1>
                    <p className="text-xs text-gray-600">{householdName}</p>
                  </div>
                </div>
                <nav className="flex gap-2">
                  {[
                    { id: 'home', icon: Home, label: 'Home' },
                    { id: 'add', icon: Plus, label: 'Add' },
                    { id: 'all', icon: Receipt, label: 'All' },
                  ].map(nav => (
                    <button key={nav.id} onClick={() => setCurrentView(nav.id)}
                      className={`px-3 py-2 rounded-lg font-semibold flex items-center gap-2 text-sm ${
                        currentView === nav.id ? 'bg-orange-600 text-white card-shadow' : 'bg-white text-gray-700 hover:bg-orange-100'
                      }`}>
                      <nav.icon className="w-4 h-4" />
                      <span className="hidden sm:inline">{nav.label}</span>
                    </button>
                  ))}
                  <button 
                    onClick={() => loadExpenses(householdId)}
                    disabled={refreshing}
                    className="px-3 py-2 bg-white text-gray-700 hover:bg-orange-100 rounded-lg font-semibold flex items-center gap-2 text-sm"
                  >
                    <RefreshCw className={`w-4 h-4 ${refreshing ? 'spin' : ''}`} />
                  </button>
                </nav>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-8">
            {currentView === 'home' && <HomeView expenses={expenses} />}
            {currentView === 'add' && <AddExpenseView onSave={addExpense} people={people} />}
            {currentView === 'all' && <AllExpensesView expenses={expenses} onDelete={deleteExpense} people={people} />}
          </main>
        </div>
      );
    }

    function HomeView({ expenses }) {
      // Calculate totals by person
      const totals = {};
      expenses.forEach(exp => {
        if (exp.paid_by) {
          totals[exp.paid_by] = (totals[exp.paid_by] || 0) + (parseFloat(exp.amount) || 0);
        }
      });

      const totalAmount = Object.values(totals).reduce((sum, val) => sum + val, 0);

      // Get current month expenses
      const currentMonth = new Date().toISOString().slice(0, 7);
      const monthlyTotal = expenses.filter(e => e.created_at.startsWith(currentMonth))
        .reduce((sum, e) => sum + (parseFloat(e.amount) || 0), 0);

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="bg-white p-4 rounded-2xl card-shadow border-4 border-orange-900">
              <DollarSign className="w-5 h-5 text-orange-600 mb-2" />
              <p className="text-xs font-semibold text-gray-600 uppercase">Total</p>
              <p className="text-2xl md:text-3xl font-black text-orange-900 mono-font">${totalAmount.toFixed(2)}</p>
            </div>
            <div className="bg-white p-4 rounded-2xl card-shadow border-4 border-green-700">
              <Calendar className="w-5 h-5 text-green-600 mb-2" />
              <p className="text-xs font-semibold text-gray-600 uppercase">This Month</p>
              <p className="text-2xl md:text-3xl font-black text-green-700 mono-font">${monthlyTotal.toFixed(2)}</p>
            </div>
            <div className="bg-white p-4 rounded-2xl card-shadow border-4 border-blue-700">
              <Receipt className="w-5 h-5 text-blue-600 mb-2" />
              <p className="text-xs font-semibold text-gray-600 uppercase">Expenses</p>
              <p className="text-2xl md:text-3xl font-black text-blue-700 mono-font">{expenses.length}</p>
            </div>
            <div className="bg-white p-4 rounded-2xl card-shadow border-4 border-purple-700">
              <TrendingUp className="w-5 h-5 text-purple-600 mb-2" />
              <p className="text-xs font-semibold text-gray-600 uppercase">Avg/Expense</p>
              <p className="text-2xl md:text-3xl font-black text-purple-700 mono-font">
                ${expenses.length > 0 ? (totalAmount / expenses.length).toFixed(2) : '0.00'}
              </p>
            </div>
          </div>

          <div className="bg-white p-6 rounded-2xl card-shadow border-4 border-gray-900">
            <h2 className="text-xl font-black text-gray-900 mb-4 display-font">Spending by Person</h2>
            <div className="space-y-3">
              {Object.entries(totals).map(([person, amount]) => {
                const percentage = totalAmount > 0 ? (amount / totalAmount * 100) : 0;
                return (
                  <div key={person}>
                    <div className="flex justify-between items-center mb-2">
                      <span className="font-bold text-gray-900">{person}</span>
                      <span className="font-black mono-font text-orange-600">
                        ${amount.toFixed(2)} ({percentage.toFixed(1)}%)
                      </span>
                    </div>
                    <div className="w-full bg-gray-200 rounded-full h-4">
                      <div className="h-4 rounded-full bg-orange-600" style={{ width: `${percentage}%` }} />
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-white p-6 rounded-2xl card-shadow border-4 border-gray-900">
            <h2 className="text-xl font-black text-gray-900 mb-4 display-font">Recent Expenses</h2>
            {expenses.length === 0 ? (
              <div className="text-center py-8">
                <ShoppingCart className="w-12 h-12 text-gray-400 mx-auto mb-3" />
                <p className="text-gray-600">No expenses yet! Click "Add" to start</p>
              </div>
            ) : (
              <div className="space-y-2">
                {expenses.slice(0, 10).map(exp => (
                  <div key={exp.id} className="p-3 bg-orange-50 rounded-lg border-2 border-orange-200">
                    <div className="flex justify-between items-center">
                      <div className="flex items-center gap-3">
                        <Store className="w-5 h-5 text-orange-600" />
                        <div>
                          <p className="font-bold text-gray-900 text-sm">{exp.item}</p>
                          <p className="text-xs text-gray-600">Paid by {exp.paid_by} • {new Date(exp.created_at).toLocaleDateString()}</p>
                        </div>
                      </div>
                      <div className="text-right">
                        <p className="text-lg font-black text-orange-900 mono-font">
                          ${parseFloat(exp.amount).toFixed(2)}
                        </p>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    function AddExpenseView({ onSave, people }) {
      const [item, setItem] = useState('');
      const [amount, setAmount] = useState('');
      const [paid_by, setPaidBy] = useState(people[0] || 'Kripu');
      const [newPerson, setNewPerson] = useState('');
      const [saving, setSaving] = useState(false);

      const handleSave = async () => {
        if (!item || !amount) {
          alert('Please fill in all fields');
          return;
        }
        
        setSaving(true);
        await onSave(item, amount, paid_by);
        setItem('');
        setAmount('');
        setNewPerson('');
        setSaving(false);
      };

      const handleAddNewPerson = () => {
        if (newPerson && !people.includes(newPerson)) {
          setPaidBy(newPerson);
          setNewPerson('');
        }
      };

      return (
        <div className="max-w-2xl mx-auto space-y-6">
          <div className="bg-white p-6 rounded-2xl card-shadow border-4 border-gray-900">
            <h2 className="text-2xl font-black text-gray-900 mb-6 display-font">Add Expense</h2>
            
            <div className="space-y-4 mb-6">
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-2">Item</label>
                <input type="text" placeholder="e.g., Milk, Eggs, Groceries" value={item} onChange={(e) => setItem(e.target.value)}
                  className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none" />
              </div>

              <div>
                <label className="block text-sm font-bold text-gray-700 mb-2">Amount</label>
                <input type="number" step="0.01" placeholder="0.00" value={amount} onChange={(e) => setAmount(e.target.value)}
                  className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none mono-font" />
              </div>

              <div>
                <label className="block text-sm font-bold text-gray-700 mb-2">Paid By</label>
                <div className="flex gap-2 mb-3">
                  <select value={paid_by} onChange={(e) => setPaidBy(e.target.value)}
                    className="flex-1 px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none">
                    {people.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
                
                <div className="flex gap-2">
                  <input type="text" placeholder="Add new person" value={newPerson} onChange={(e) => setNewPerson(e.target.value)}
                    className="flex-1 px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none text-sm" />
                  <button onClick={handleAddNewPerson} className="px-3 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 text-sm">
                    <Plus className="w-4 h-4" />
                  </button>
                </div>
              </div>
            </div>

            <button 
              onClick={handleSave}
              disabled={saving}
              className="w-full py-3 bg-orange-600 text-white text-lg font-black rounded-lg hover:bg-orange-700 card-shadow disabled:opacity-50"
            >
              {saving ? 'Saving...' : 'Add Expense'}
            </button>
          </div>
        </div>
      );
    }

    function AllExpensesView({ expenses, onDelete, people }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [filterPerson, setFilterPerson] = useState('');

      const filteredExpenses = expenses.filter(exp => {
        const matchesSearch = exp.item.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesPerson = !filterPerson || exp.paid_by === filterPerson;
        return matchesSearch && matchesPerson;
      });

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl card-shadow border-4 border-gray-900">
            <div className="space-y-4">
              <input type="text" placeholder="Search expenses..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
                className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none" />
              
              <select value={filterPerson} onChange={(e) => setFilterPerson(e.target.value)}
                className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none">
                <option value="">All People</option>
                {people.map(p => <option key={p} value={p}>{p}</option>)}
              </select>
            </div>
          </div>

          <div className="space-y-4">
            {filteredExpenses.map(exp => (
              <div key={exp.id} className="bg-white p-6 rounded-2xl card-shadow border-4 border-gray-900">
                <div className="flex justify-between items-start">
                  <div>
                    <h3 className="text-xl font-black text-gray-900 display-font">{exp.item}</h3>
                    <p className="text-sm text-gray-600">
                      Paid by <span className="font-bold">{exp.paid_by}</span> • {new Date(exp.created_at).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                    </p>
                  </div>
                  <div className="text-right">
                    <p className="text-2xl font-black text-orange-900 mono-font">${parseFloat(exp.amount).toFixed(2)}</p>
                    <button onClick={() => window.confirm('Delete this expense?') && onDelete(exp.id)} className="mt-2 text-red-600 hover:text-red-800 font-semibold text-sm">Delete</button>
                  </div>
                </div>
              </div>
            ))}
            {filteredExpenses.length === 0 && <p className="text-center text-gray-500 py-8">No expenses found</p>}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GroceryExpenseApp />);
  </script>
</body>
</html>
