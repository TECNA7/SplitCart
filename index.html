<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplitCart - Grocery Expense Sharing</title>
  
  <!-- Load React -->
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- Load Babel -->
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  
  <!-- Load Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Icons (simplified inline SVG components)
    const ShoppingCart = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>;
    const Plus = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const Trash2 = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
    const Home = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    const Receipt = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><path d="M16 8h-6M16 12h-6M16 16h-6"/></svg>;
    const User = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const Settings = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m-9-6h6m6 0h6"/></svg>;
    const Calendar = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    const Store = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    const DollarSign = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
    const TrendingUp = (props) => <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;

    const STORES = ['Walmart', 'Indian Market', 'Kroger', 'Target', 'Costco', 'Trader Joe\'s', 'Whole Foods', 'Aldi', 'Other'];
    const DEFAULT_ROOMMATES = {
      person1: { name: 'Alex', color: '#e07a5f' },
      person2: { name: 'Jordan', color: '#81b29a' },
      person3: { name: 'Taylor', color: '#f4a261' }
    };

    // Storage helpers
    const storageHelpers = {
      getTrips() {
        try {
          const data = localStorage.getItem('splitcart_trips');
          return data ? JSON.parse(data).sort((a, b) => new Date(b.date) - new Date(a.date)) : [];
        } catch (e) { return []; }
      },
      saveTrip(trip) {
        try {
          const trips = this.getTrips();
          const index = trips.findIndex(t => t.id === trip.id);
          if (index >= 0) trips[index] = trip;
          else trips.push(trip);
          localStorage.setItem('splitcart_trips', JSON.stringify(trips));
          return true;
        } catch (e) { return false; }
      },
      deleteTrip(tripId) {
        try {
          const trips = this.getTrips().filter(t => t.id !== tripId);
          localStorage.setItem('splitcart_trips', JSON.stringify(trips));
          return true;
        } catch (e) { return false; }
      },
      getRoommates() {
        try {
          const data = localStorage.getItem('splitcart_roommates');
          return data ? JSON.parse(data) : DEFAULT_ROOMMATES;
        } catch (e) { return DEFAULT_ROOMMATES; }
      },
      saveRoommates(roommates) {
        try {
          localStorage.setItem('splitcart_roommates', JSON.stringify(roommates));
          return true;
        } catch (e) { return false; }
      }
    };

    const calculateItemSplit = (cost, assignedTo) => {
      const share = cost / assignedTo.length;
      return assignedTo.reduce((acc, person) => {
        acc[person] = (acc[person] || 0) + share;
        return acc;
      }, {});
    };

    const calculateTripTotals = (items) => {
      const totals = { person1: 0, person2: 0, person3: 0 };
      items.forEach(item => {
        const split = calculateItemSplit(parseFloat(item.cost) || 0, item.assignedTo);
        Object.keys(split).forEach(person => {
          totals[person] = (totals[person] || 0) + split[person];
        });
      });
      return totals;
    };

    function GroceryExpenseApp() {
      const [currentView, setCurrentView] = useState('home');
      const [trips, setTrips] = useState([]);
      const [roommates, setRoommates] = useState(DEFAULT_ROOMMATES);
      const [selectedPerson, setSelectedPerson] = useState('person1');
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        try {
          setTrips(storageHelpers.getTrips());
          setRoommates(storageHelpers.getRoommates());
        } finally {
          setLoading(false);
        }
      }, []);

      const addTrip = (trip) => {
        if (storageHelpers.saveTrip(trip)) {
          setTrips(storageHelpers.getTrips());
          setCurrentView('home');
        }
      };

      const deleteTrip = (tripId) => {
        if (storageHelpers.deleteTrip(tripId)) setTrips(storageHelpers.getTrips());
      };

      const updateRoommates = (newRoommates) => {
        if (storageHelpers.saveRoommates(newRoommates)) setRoommates(newRoommates);
      };

      if (loading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50 flex items-center justify-center">
            <div className="text-center">
              <ShoppingCart className="w-16 h-16 text-orange-600 animate-bounce mx-auto mb-4" />
              <p className="text-xl text-gray-700">Loading...</p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50">
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Karla:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap');
            * { font-family: 'Karla', sans-serif; }
            .display-font { font-family: 'Playfair Display', serif; }
            .mono-font { font-family: 'JetBrains Mono', monospace; }
            .card-shadow { box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.1); }
          `}</style>

          <header className="bg-white border-b-4 border-orange-900 sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 py-4">
              <div className="flex items-center justify-between flex-wrap gap-4">
                <div className="flex items-center gap-3">
                  <ShoppingCart className="w-8 h-8 text-orange-600" />
                  <h1 className="text-3xl font-black text-orange-900 display-font">SplitCart</h1>
                </div>
                <nav className="flex gap-2">
                  {[
                    { id: 'home', icon: Home, label: 'Home' },
                    { id: 'add', icon: Plus, label: 'Add' },
                    { id: 'personal', icon: User, label: 'My View' },
                    { id: 'all', icon: Receipt, label: 'All' },
                    { id: 'settings', icon: Settings, label: 'Settings' }
                  ].map(nav => (
                    <button key={nav.id} onClick={() => setCurrentView(nav.id)}
                      className={`px-3 py-2 rounded-lg font-semibold flex items-center gap-2 text-sm ${
                        currentView === nav.id ? 'bg-orange-600 text-white card-shadow' : 'bg-white text-gray-700 hover:bg-orange-100'
                      }`}>
                      <nav.icon className="w-4 h-4" />
                      <span className="hidden sm:inline">{nav.label}</span>
                    </button>
                  ))}
                </nav>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-8">
            {currentView === 'home' && <HomeView trips={trips} roommates={roommates} />}
            {currentView === 'add' && <AddTripView onSave={addTrip} roommates={roommates} />}
            {currentView === 'personal' && <PersonalView trips={trips} roommates={roommates} selectedPerson={selectedPerson} setSelectedPerson={setSelectedPerson} />}
            {currentView === 'all' && <AllTripsView trips={trips} roommates={roommates} onDelete={deleteTrip} />}
            {currentView === 'settings' && <SettingsView roommates={roommates} onUpdate={updateRoommates} />}
          </main>
        </div>
      );
    }

    function HomeView({ trips, roommates }) {
      const totals = { person1: 0, person2: 0, person3: 0 };
      trips.forEach(trip => Object.keys(trip.totals).forEach(person => totals[person] += trip.totals[person]));
      const householdTotal = Object.values(totals).reduce((sum, val) => sum + val, 0);
      const currentMonth = new Date().toISOString().slice(0, 7);
      const monthlyTotal = trips.filter(t => t.date.startsWith(currentMonth))
        .reduce((sum, trip) => sum + Object.values(trip.totals).reduce((s, v) => s + v, 0), 0);

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="bg-white p-4 rounded-2xl card-shadow border-4 border-orange-900">
              <DollarSign className="w-5 h-5 text-orange-600 mb-2" />
              <p className="text-xs font-semibold text-gray-600 uppercase">Total</p>
              <p className="text-2xl md:text-3xl font-black text-orange-900 mono-font">${householdTotal.toFixed(2)}</p>
            </div>
            <div className="bg-white p-4 rounded-2xl card-shadow border-4 border-green-700">
              <Calendar className="w-5 h-5 text-green-600 mb-2" />
              <p className="text-xs font-semibold text-gray-600 uppercase">This Month</p>
              <p className="text-2xl md:text-3xl font-black text-green-700 mono-font">${monthlyTotal.toFixed(2)}</p>
            </div>
            <div className="bg-white p-4 rounded-2xl card-shadow border-4 border-blue-700">
              <Receipt className="w-5 h-5 text-blue-600 mb-2" />
              <p className="text-xs font-semibold text-gray-600 uppercase">Trips</p>
              <p className="text-2xl md:text-3xl font-black text-blue-700 mono-font">{trips.length}</p>
            </div>
            <div className="bg-white p-4 rounded-2xl card-shadow border-4 border-purple-700">
              <TrendingUp className="w-5 h-5 text-purple-600 mb-2" />
              <p className="text-xs font-semibold text-gray-600 uppercase">Avg/Trip</p>
              <p className="text-2xl md:text-3xl font-black text-purple-700 mono-font">
                ${trips.length > 0 ? (householdTotal / trips.length).toFixed(2) : '0.00'}
              </p>
            </div>
          </div>

          <div className="bg-white p-6 rounded-2xl card-shadow border-4 border-gray-900">
            <h2 className="text-xl font-black text-gray-900 mb-4 display-font">Spending by Person</h2>
            <div className="space-y-3">
              {Object.keys(roommates).map(person => {
                const personTotal = totals[person];
                const percentage = householdTotal > 0 ? (personTotal / householdTotal * 100) : 0;
                return (
                  <div key={person}>
                    <div className="flex justify-between items-center mb-2">
                      <span className="font-bold text-gray-900">{roommates[person].name}</span>
                      <span className="font-black mono-font" style={{ color: roommates[person].color }}>
                        ${personTotal.toFixed(2)} ({percentage.toFixed(1)}%)
                      </span>
                    </div>
                    <div className="w-full bg-gray-200 rounded-full h-4">
                      <div className="h-4 rounded-full" style={{ width: `${percentage}%`, backgroundColor: roommates[person].color }} />
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-white p-6 rounded-2xl card-shadow border-4 border-gray-900">
            <h2 className="text-xl font-black text-gray-900 mb-4 display-font">Recent Trips</h2>
            {trips.length === 0 ? (
              <div className="text-center py-8">
                <ShoppingCart className="w-12 h-12 text-gray-400 mx-auto mb-3" />
                <p className="text-gray-600">No trips yet! Click "Add" to start</p>
              </div>
            ) : (
              <div className="space-y-2">
                {trips.slice(0, 10).map(trip => (
                  <div key={trip.id} className="p-3 bg-orange-50 rounded-lg border-2 border-orange-200">
                    <div className="flex justify-between items-center">
                      <div className="flex items-center gap-3">
                        <Store className="w-5 h-5 text-orange-600" />
                        <div>
                          <p className="font-bold text-gray-900 text-sm">{trip.store}</p>
                          <p className="text-xs text-gray-600">{new Date(trip.date).toLocaleDateString()}</p>
                        </div>
                      </div>
                      <div className="text-right">
                        <p className="text-lg font-black text-orange-900 mono-font">
                          ${Object.values(trip.totals).reduce((s, v) => s + v, 0).toFixed(2)}
                        </p>
                        <p className="text-xs text-gray-600">{trip.items.length} items</p>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    function AddTripView({ onSave, roommates }) {
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [store, setStore] = useState('Walmart');
      const [items, setItems] = useState([{ id: Date.now(), name: '', cost: '', assignedTo: ['person1', 'person2', 'person3'] }]);

      const addItem = () => setItems([...items, { id: Date.now(), name: '', cost: '', assignedTo: ['person1', 'person2', 'person3'] }]);
      const removeItem = (id) => setItems(items.filter(item => item.id !== id));
      const updateItem = (id, field, value) => setItems(items.map(item => item.id === id ? { ...item, [field]: value } : item));
      
      const togglePerson = (itemId, person) => {
        setItems(items.map(item => {
          if (item.id !== itemId) return item;
          const assigned = item.assignedTo.includes(person) ? item.assignedTo.filter(p => p !== person) : [...item.assignedTo, person];
          return { ...item, assignedTo: assigned.length > 0 ? assigned : [person] };
        }));
      };

      const handleSave = () => {
        const validItems = items.filter(i => i.name && i.cost);
        if (validItems.length === 0) { alert('Please add at least one item with name and cost'); return; }
        onSave({ id: `trip_${Date.now()}`, date, store, items: validItems.map(item => ({ ...item, cost: parseFloat(item.cost) })), totals: calculateTripTotals(validItems) });
      };

      const tripTotal = items.reduce((sum, item) => sum + (parseFloat(item.cost) || 0), 0);
      const previewTotals = calculateTripTotals(items);

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-white p-6 rounded-2xl card-shadow border-4 border-gray-900">
            <h2 className="text-2xl font-black text-gray-900 mb-6 display-font">Add Shopping Trip</h2>
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-2">Date</label>
                <input type="date" value={date} onChange={(e) => setDate(e.target.value)}
                  className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none" />
              </div>
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-2">Store</label>
                <select value={store} onChange={(e) => setStore(e.target.value)}
                  className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none">
                  {STORES.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
            </div>

            <div className="space-y-4 mb-6">
              <div className="flex items-center justify-between">
                <h3 className="text-lg font-bold text-gray-900">Items</h3>
                <button onClick={addItem} className="px-3 py-2 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 flex items-center gap-2 text-sm">
                  <Plus className="w-4 h-4" />Add
                </button>
              </div>

              {items.map(item => (
                <div key={item.id} className="p-4 bg-gray-50 rounded-lg border-2 border-gray-200">
                  <div className="space-y-3">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <input type="text" placeholder="Item name" value={item.name} onChange={(e) => updateItem(item.id, 'name', e.target.value)}
                        className="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none" />
                      <input type="number" step="0.01" placeholder="Cost" value={item.cost} onChange={(e) => updateItem(item.id, 'cost', e.target.value)}
                        className="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none mono-font" />
                    </div>
                    <div className="flex gap-2">
                      {Object.keys(roommates).map(person => (
                        <button key={person} onClick={() => togglePerson(item.id, person)}
                          className={`px-3 py-2 rounded-lg font-semibold flex-1 text-sm ${item.assignedTo.includes(person) ? 'text-white' : 'bg-gray-200 text-gray-600'}`}
                          style={{ backgroundColor: item.assignedTo.includes(person) ? roommates[person].color : undefined }}>
                          {roommates[person].name}
                        </button>
                      ))}
                      {items.length > 1 && (
                        <button onClick={() => removeItem(item.id)} className="px-3 py-2 text-red-600 hover:bg-red-100 rounded-lg">
                          <Trash2 className="w-5 h-5" />
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              ))}
            </div>

            <div className="bg-orange-50 p-4 rounded-lg border-2 border-orange-200 mb-6">
              <h3 className="font-bold text-gray-900 mb-3">Summary</h3>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div>
                  <p className="text-xs text-gray-600">Total</p>
                  <p className="text-xl font-black text-orange-900 mono-font">${tripTotal.toFixed(2)}</p>
                </div>
                {Object.keys(roommates).map(person => (
                  <div key={person}>
                    <p className="text-xs text-gray-600">{roommates[person].name}</p>
                    <p className="text-xl font-black mono-font" style={{ color: roommates[person].color }}>
                      ${(previewTotals[person] || 0).toFixed(2)}
                    </p>
                  </div>
                ))}
              </div>
            </div>

            <button onClick={handleSave} className="w-full py-3 bg-orange-600 text-white text-lg font-black rounded-lg hover:bg-orange-700 card-shadow">
              Save Trip
            </button>
          </div>
        </div>
      );
    }

    function PersonalView({ trips, roommates, selectedPerson, setSelectedPerson }) {
      const personalTotal = trips.reduce((sum, trip) => sum + (trip.totals[selectedPerson] || 0), 0);
      const householdTotal = trips.reduce((sum, trip) => sum + Object.values(trip.totals).reduce((s, v) => s + v, 0), 0);
      const personalPercentage = householdTotal > 0 ? (personalTotal / householdTotal * 100) : 0;

      const myItems = [];
      trips.forEach(trip => {
        trip.items.forEach(item => {
          if (item.assignedTo.includes(selectedPerson)) {
            myItems.push({ ...item, date: trip.date, store: trip.store, myShare: item.cost / item.assignedTo.length });
          }
        });
      });

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl card-shadow border-4 border-gray-900">
            <select value={selectedPerson} onChange={(e) => setSelectedPerson(e.target.value)}
              className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none text-lg font-bold">
              {Object.keys(roommates).map(person => (
                <option key={person} value={person}>{roommates[person].name}'s Dashboard</option>
              ))}
            </select>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-white p-6 rounded-2xl card-shadow border-4 border-gray-900">
              <p className="text-sm font-semibold text-gray-600 uppercase mb-2">My Total</p>
              <p className="text-3xl font-black mono-font" style={{ color: roommates[selectedPerson].color }}>${personalTotal.toFixed(2)}</p>
            </div>
            <div className="bg-white p-6 rounded-2xl card-shadow border-4 border-gray-900">
              <p className="text-sm font-semibold text-gray-600 uppercase mb-2">% of Total</p>
              <p className="text-3xl font-black text-gray-900 mono-font">{personalPercentage.toFixed(1)}%</p>
            </div>
            <div className="bg-white p-6 rounded-2xl card-shadow border-4 border-gray-900">
              <p className="text-sm font-semibold text-gray-600 uppercase mb-2">My Items</p>
              <p className="text-3xl font-black text-gray-900 mono-font">{myItems.length}</p>
            </div>
          </div>

          <div className="bg-white p-6 rounded-2xl card-shadow border-4 border-gray-900">
            <h2 className="text-xl font-black text-gray-900 mb-4 display-font">My Items</h2>
            <div className="space-y-2 max-h-96 overflow-y-auto">
              {myItems.map((item, idx) => (
                <div key={idx} className="p-3 bg-gray-50 rounded-lg border-2 border-gray-200 flex justify-between items-center">
                  <div>
                    <p className="font-bold text-gray-900 text-sm">{item.name}</p>
                    <p className="text-xs text-gray-600">{item.store} • {new Date(item.date).toLocaleDateString()}</p>
                  </div>
                  <p className="text-lg font-black mono-font" style={{ color: roommates[selectedPerson].color }}>${item.myShare.toFixed(2)}</p>
                </div>
              ))}
              {myItems.length === 0 && <p className="text-center text-gray-500 py-8">No items yet</p>}
            </div>
          </div>
        </div>
      );
    }

    function AllTripsView({ trips, roommates, onDelete }) {
      const [searchTerm, setSearchTerm] = useState('');
      const filteredTrips = trips.filter(trip =>
        trip.store.toLowerCase().includes(searchTerm.toLowerCase()) ||
        trip.items.some(item => item.name.toLowerCase().includes(searchTerm.toLowerCase()))
      );

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl card-shadow border-4 border-gray-900">
            <input type="text" placeholder="Search trips or items..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
              className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none" />
          </div>

          <div className="space-y-4">
            {filteredTrips.map(trip => (
              <div key={trip.id} className="bg-white p-6 rounded-2xl card-shadow border-4 border-gray-900">
                <div className="flex justify-between items-start mb-4">
                  <div>
                    <h3 className="text-xl font-black text-gray-900 display-font">{trip.store}</h3>
                    <p className="text-sm text-gray-600">{new Date(trip.date).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                  </div>
                  <div className="text-right">
                    <p className="text-2xl font-black text-orange-900 mono-font">${Object.values(trip.totals).reduce((s, v) => s + v, 0).toFixed(2)}</p>
                    <button onClick={() => window.confirm('Delete this trip?') && onDelete(trip.id)} className="mt-2 text-red-600 hover:text-red-800 font-semibold text-sm">Delete</button>
                  </div>
                </div>

                <div className="space-y-2 mb-4">
                  {trip.items.map((item, idx) => (
                    <div key={idx} className="p-3 bg-gray-50 rounded-lg flex justify-between items-center">
                      <div>
                        <p className="font-bold text-gray-900 text-sm">{item.name}</p>
                        <div className="flex gap-2 mt-1">
                          {item.assignedTo.map(person => (
                            <span key={person} className="px-2 py-1 rounded text-xs font-semibold text-white" style={{ backgroundColor: roommates[person].color }}>
                              {roommates[person].name}
                            </span>
                          ))}
                        </div>
                      </div>
                      <p className="text-lg font-black text-gray-900 mono-font">${item.cost.toFixed(2)}</p>
                    </div>
                  ))}
                </div>

                <div className="pt-4 border-t-2 border-gray-200 flex justify-end gap-4">
                  {Object.keys(roommates).map(person => (
                    <div key={person} className="text-right">
                      <p className="text-xs text-gray-600">{roommates[person].name}</p>
                      <p className="text-lg font-black mono-font" style={{ color: roommates[person].color }}>${(trip.totals[person] || 0).toFixed(2)}</p>
                    </div>
                  ))}
                </div>
              </div>
            ))}
            {filteredTrips.length === 0 && <p className="text-center text-gray-500 py-8">No trips found</p>}
          </div>
        </div>
      );
    }

    function SettingsView({ roommates, onUpdate }) {
      const [editedRoommates, setEditedRoommates] = useState(roommates);

      return (
        <div className="max-w-2xl mx-auto space-y-6">
          <div className="bg-white p-8 rounded-2xl card-shadow border-4 border-gray-900">
            <h2 className="text-2xl font-black text-gray-900 mb-6 display-font">Roommate Names</h2>
            <div className="space-y-4 mb-6">
              {Object.keys(editedRoommates).map(person => (
                <div key={person}>
                  <label className="block text-sm font-bold text-gray-700 mb-2">Roommate {person.slice(-1)}</label>
                  <input type="text" value={editedRoommates[person].name}
                    onChange={(e) => setEditedRoommates({ ...editedRoommates, [person]: { ...editedRoommates[person], name: e.target.value } })}
                    className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none" />
                </div>
              ))}
            </div>
            <button onClick={() => { onUpdate(editedRoommates); alert('Settings saved!'); }}
              className="w-full py-3 bg-orange-600 text-white text-lg font-black rounded-lg hover:bg-orange-700 card-shadow">
              Save Settings
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GroceryExpenseApp />);
  </script>
</body>
</html>
